# UNTESTED: written for the later real run, not run by the author.
method: poc1-gpu
variant: qwen3_8b
base_model:
  repo_id: Qwen/Qwen3-8B
  local_dir: models/qwen3-8b
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  seed: 42
  max_length: 256
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  epochs: 3
  # small batch with accumulation: effective batch size 16
  per_device_batch_size: 2
  grad_accum_steps: 8
  logging_steps: 5
  save_steps: 20
  save_total_limit: 2
  gradient_checkpointing: true
  max_steps: null
  demo_sleep_per_step_s: 0
eval:
  threshold_percentile: 99
