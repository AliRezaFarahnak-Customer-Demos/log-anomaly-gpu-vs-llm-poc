method: poc1-gpu
variant: tiny
base_model:
  repo_id: Qwen/Qwen3-0.6B
  # relative to ML_ROOT
  local_dir: models/qwen3-0.6b
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  seed: 42
  max_length: 256
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  epochs: 3
  per_device_batch_size: 16
  grad_accum_steps: 1
  logging_steps: 5
  save_steps: 20
  save_total_limit: 2
  gradient_checkpointing: false
  # set to a number of steps to stop early, for smoke tests only
  max_steps: null
  # stretch a run for demos, seconds of sleep after each step
  demo_sleep_per_step_s: 0
eval:
  threshold_percentile: 99
